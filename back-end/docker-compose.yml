services:
  postgres:
    image: postgres:16
    container_name: event-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./back-end
    container_name: event-platform-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: manager
      TMDB_API_KEY: ${TMDB_API_KEY}
    ports:
      - "8080:8080"

volumes:
  postgres_data: